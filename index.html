<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Xadrez Local - Níveis Otimizados</title>
    
    <link rel="stylesheet" href="lib/chessboard-1.0.0.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #2c3e50; color: white; margin-top: 20px; }
        
        #meuTabuleiro { width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        #status-bar { background-color: #34495e; width: 400px; margin: 20px auto; padding: 10px; border-radius: 8px; font-size: 1.1em; }
        
        .controles { margin-bottom: 20px; background: #34495e; padding: 15px; border-radius: 8px; display: inline-block; }
        .controle-grupo { margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        select { padding: 8px 15px; border-radius: 5px; font-size: 1em; cursor: pointer; }

        .placar-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; font-size: 1.2em; font-weight: bold; }
        .placar-item { padding: 10px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .placar-brancas { background-color: #ecf0f1; color: #2c3e50; }
        .placar-empates { background-color: #95a5a6; color: white; }
        .placar-pretas { background-color: #1a252f; color: white; border: 1px solid #7f8c8d; }

        .area-capturadas { width: 400px; min-height: 40px; margin: 5px auto; background-color: rgba(0,0,0,0.2); border-radius: 5px; display: flex; flex-wrap: wrap; align-items: center; padding: 5px; box-sizing: border-box; }
        .area-capturadas img { width: 30px; height: 30px; margin: 2px; }

        /* --- AS SUAS CORES CUSTOMIZADAS --- */
        .casa-selecionada { box-shadow: inset 0 0 0 5px rgba(255, 255, 0, 0.9) !important; background-color: rgba(220, 220, 95, 0.972) !important; }
        .pode-mover { box-shadow: inset 0 0 0 5px rgba(50, 68, 228, 0.9) !important; background-color: #5fa7ff !important; cursor: pointer; }

        .tema-verde .white-1e1d7 { background-color: #ebecd0; color: #739552; }
        .tema-verde .black-3c85d { background-color: #739552; color: #ebecd0; }
        .tema-azul .white-1e1d7 { background-color: #dee3e6; color: #8ca2ad; }
        .tema-azul .black-3c85d { background-color: #8ca2ad; color: #dee3e6; }

        button { background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1em; margin-top: 10px; }
        button:hover { background-color: #2ecc71; }
        
        .toggle-som { font-size: 1.1em; cursor: pointer; user-select: none; }
        .toggle-som input { width: 18px; height: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Xadrez</h2>

    <div class="placar-container">
        <div class="placar-item placar-brancas">Brancas: <span id="pts-brancas">0</span></div>
        <div class="placar-item placar-empates">Empates: <span id="pts-empates">0</span></div>
        <div class="placar-item placar-pretas">Pretas: <span id="pts-pretas">0</span></div>
    </div>
    
    <div class="controles">
        <div class="controle-grupo">
            <label for="modo-jogo"><strong>Modo: </strong></label>
            <select id="modo-jogo">
                <option value="humano">Humano vs Humano</option>
                <option value="bot-1">PC: Nível 1 (Iniciante)</option>
                <option value="bot-2">PC: Nível 2 (Fácil)</option>
                <option value="bot-3">PC: Nível 3 (Médio)</option>
                <option value="bot-4">PC: Nível 4 (Difícil)</option>
            </select>
            
            <label class="toggle-som" style="margin-left: 15px;">
                <input type="checkbox" id="som-toggle" checked> 🔊 Som
            </label>
        </div>
        
        <div class="controle-grupo">
            <label for="tema-select"><strong>Estilo: </strong></label>
            <select id="tema-select">
                <option value="wikipedia">Clássico</option>
                <option value="medieval">Medieval Fantasia</option>
            </select>
            <label for="cor-select" style="margin-left: 10px;"><strong>Tabuleiro: </strong></label>
            <select id="cor-select">
                <option value="padrao">Madeira</option>
                <option value="tema-verde">Verde</option>
                <option value="tema-azul">Azul</option>
            </select>
        </div>
    </div>

    <div id="capturas-pretas" class="area-capturadas"></div>
    <div id="meuTabuleiro"></div>
    <div id="capturas-brancas" class="area-capturadas"></div>
    
    <div id="status-bar">
        Vez das: <span id="status-vez">Brancas</span><br>
        <span id="status-info" style="color: #e74c3c;"></span>
    </div>

    <button id="restartBtn">Nova Partida</button>

    <script src="lib/jquery-3.7.1.min.js"></script>
    <script src="lib/chessboard-1.0.0.min.js"></script>
    <script src="lib/chess-0.10.3.min.js"></script>
    
    <script>
        var game = new Chess();
        var board = null;
        var casaSelecionada = null; 
        var botTimeout = null; 

        var pontosBrancas = 0;
        var pontosPretas = 0;
        var pontosEmpates = 0;
        var jogoContabilizado = false; 

        var capturadasPelasBrancas = []; 
        var capturadasPelasPretas = [];

        function tocarSom(tipo) {
            if (!$('#som-toggle').is(':checked')) return;
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return; 

            var ctx = new AudioContext();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();

            osc.connect(gain);
            gain.connect(ctx.destination);

            if (tipo === 'move') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } 
            else if (tipo === 'check') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } 
            else if (tipo === 'mate') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 1.0);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
                osc.start();
                osc.stop(ctx.currentTime + 1.0);
            }
        }

        function avaliarETocarSom() {
            if (game.in_checkmate()) tocarSom('mate');
            else if (game.in_check()) tocarSom('check');
            else tocarSom('move');
        }

        function inicializarTabuleiro() {
            var tema = $('#tema-select').val();
            var cor = $('#cor-select').val();

            if (board !== null) board.destroy();

            var config = {
                draggable: true,
                position: game.fen(),
                pieceTheme: 'img/chesspieces/' + tema + '/{piece}.png',
                
                onDragStart: function(source, piece) {
                    if (game.game_over()) return false;
                    var modo = $('#modo-jogo').val();
                    if (modo !== 'humano' && piece.search(/^b/) !== -1) return false;
                    if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                        (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
                        
                    removeHighlights();
                    casaSelecionada = null;
                },
                onDrop: function(source, target) {
                    var move = game.move({ from: source, to: target, promotion: 'q' });
                    if (move === null) return 'snapback';
                    
                    avaliarETocarSom(); 
                    registrarCaptura(move);
                    updateStatus();
                    agendarBot(); 
                },
                onSnapEnd: function() { board.position(game.fen()); }
            };

            board = Chessboard('meuTabuleiro', config);
            $('#meuTabuleiro').removeClass('tema-verde tema-azul padrao').addClass(cor);
            renderizarCapturadas();
        }

        function registrarCaptura(move) {
            if (move.captured) {
                var corDaPecaComida = (move.color === 'w') ? 'b' : 'w';
                var pecaImg = corDaPecaComida + move.captured.toUpperCase();

                if (move.color === 'w') capturadasPelasBrancas.push(pecaImg);
                else capturadasPelasPretas.push(pecaImg);
                
                renderizarCapturadas();
            }
        }

        function renderizarCapturadas() {
            var tema = $('#tema-select').val();
            $('#capturas-brancas').empty();
            $('#capturas-pretas').empty();

            capturadasPelasBrancas.forEach(function(peca) {
                $('#capturas-brancas').append('<img src="img/chesspieces/' + tema + '/' + peca + '.png">');
            });
            capturadasPelasPretas.forEach(function(peca) {
                $('#capturas-pretas').append('<img src="img/chesspieces/' + tema + '/' + peca + '.png">');
            });
        }

        function updateStatus() {
            var vez = (game.turn() === 'w') ? 'Brancas' : 'Pretas';
            $('#status-vez').text(vez);
            var infoText = '';
            
            if (game.game_over() && !jogoContabilizado) {
                if (game.in_checkmate()) {
                    if (game.turn() === 'w') { pontosPretas++; $('#pts-pretas').text(pontosPretas); } 
                    else { pontosBrancas++; $('#pts-brancas').text(pontosBrancas); }
                    infoText = 'FIM DE JOGO: Xeque-mate nas ' + vez + '!';
                } else {
                    pontosEmpates++; $('#pts-empates').text(pontosEmpates);
                    infoText = 'FIM DE JOGO: Empate!';
                }
                jogoContabilizado = true; 
            } else if (!game.game_over()) {
                if (game.in_check()) infoText = 'AVISO: As ' + vez + ' estão em Xeque!';
            }
            
            $('#status-info').css('color', '#e74c3c').text(infoText);
        }

        function agendarBot() {
            var modo = $('#modo-jogo').val();
            if (modo !== 'humano' && game.turn() === 'b' && !game.game_over()) {
                $('#status-info').css('color', '#f39c12').text('O PC está pensando... 🤔');
                botTimeout = setTimeout(fazerJogadaBot, 100);
            }
        }

        function fazerJogadaBot() {
            var modo = $('#modo-jogo').val();
            var moves = game.moves();
            if (moves.length === 0) return;

            var melhorJogada = moves[0];

            if (modo === 'bot-1') {
                melhorJogada = moves[Math.floor(Math.random() * moves.length)];
            } else if (modo === 'bot-2') {
                melhorJogada = calcularMelhorJogada(1);
            } else if (modo === 'bot-3') {
                melhorJogada = calcularMelhorJogada(2);
            } else if (modo === 'bot-4') {
                melhorJogada = calcularMelhorJogada(3); 
            }

            var move = game.move(melhorJogada);
            if (move) {
                avaliarETocarSom(); 
                registrarCaptura(move);
                board.position(game.fen());
                updateStatus();
            }
        }

        function avaliarPosicao() {
            var fen = game.fen().split(' ')[0];
            var score = 0;
            var valores = { 'P': 10, 'N': 30, 'B': 30, 'R': 50, 'Q': 90, 'p': -10, 'n': -30, 'b': -30, 'r': -50, 'q': -90 };
            for(var i=0; i<fen.length; i++) {
                if (valores[fen[i]]) score += valores[fen[i]];
            }
            return score;
        }

        function minimaxOtimizado(profundidade, alpha, beta, maximizando) {
            if (profundidade === 0 || game.game_over()) return avaliarPosicao();
            var moves = game.moves();

            if (maximizando) {
                var maxEval = -9999;
                for (var i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    var ev = minimaxOtimizado(profundidade - 1, alpha, beta, false);
                    game.undo();
                    maxEval = Math.max(maxEval, ev);
                    alpha = Math.max(alpha, ev);
                    if (beta <= alpha) break; 
                }
                return maxEval;
            } else {
                var minEval = 9999;
                for (var i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    var ev = minimaxOtimizado(profundidade - 1, alpha, beta, true);
                    game.undo();
                    minEval = Math.min(minEval, ev);
                    beta = Math.min(beta, ev);
                    if (beta <= alpha) break; 
                }
                return minEval;
            }
        }

        function calcularMelhorJogada(profundidade) {
            var moves = game.moves();
            var bestMove = moves[0];
            var bestValue = 9999; 

            for (var i = 0; i < moves.length; i++) {
                game.move(moves[i]);
                var boardValue = minimaxOtimizado(profundidade - 1, -10000, 10000, true); 
                game.undo();
                
                if (boardValue < bestValue) {
                    bestValue = boardValue;
                    bestMove = moves[i];
                }
            }
            return bestMove;
        }

        $(document).on('mousedown touchstart', '#meuTabuleiro [data-square]', function(evento) {
            if (game.game_over()) return;
            
            var modo = $('#modo-jogo').val();
            if (modo !== 'humano' && game.turn() === 'b') return; 

            var clicada = $(this).attr('data-square');

            if (casaSelecionada) {
                if (casaSelecionada === clicada) {
                    casaSelecionada = null; removeHighlights(); return;
                }
                var move = game.move({ from: casaSelecionada, to: clicada, promotion: 'q' });
                if (move) {
                    avaliarETocarSom(); 
                    registrarCaptura(move);
                    board.position(game.fen());
                    casaSelecionada = null;
                    removeHighlights();
                    updateStatus();
                    agendarBot(); 
                    return;
                }
            }

            var moves = game.moves({ square: clicada, verbose: true });
            removeHighlights();
            casaSelecionada = null;

            if (moves.length > 0) {
                casaSelecionada = clicada;
                $('#meuTabuleiro .square-' + clicada).addClass('casa-selecionada');
                moves.forEach(m => $('#meuTabuleiro .square-' + m.to).addClass('pode-mover'));
            }
        });

        function removeHighlights() {
            $('#meuTabuleiro .square-55d63').removeClass('pode-mover casa-selecionada');
        }

        $('#tema-select, #cor-select, #modo-jogo').on('change', function() {
            if ($('#modo-jogo').val() === 'humano') clearTimeout(botTimeout);
            inicializarTabuleiro();
            agendarBot();
        });

        $('#restartBtn').on('click', function() {
            game.reset();
            jogoContabilizado = false;
            capturadasPelasBrancas = [];
            capturadasPelasPretas = [];
            clearTimeout(botTimeout);
            removeHighlights();
            casaSelecionada = null;
            inicializarTabuleiro();
            updateStatus();
        });

        inicializarTabuleiro();
        updateStatus();
    </script>
</body>
</html>
